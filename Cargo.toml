[package]
name = "brix"
version = "0.1.0"
edition = "2024"

[dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
log = "0.4.34"
pc-keyboard = "0.9.0"
pic8259 = "0.11.0"
spin = "0.12.3"
uefi = { version = "0.41.0", features = ["logger", "panic_handler"] }
x86_64 = "0.15.5"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "allow"

[lints.clippy]
all = "warn"
correctness = { level = "deny", priority = -1 }
suspicious = "warn"
perf = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
